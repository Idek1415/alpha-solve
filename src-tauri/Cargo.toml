[package]
name = "alpha-solve-desktop"
version = "0.2.1"
description = "Alpha Solve engineering workspace"
authors = ["Alpha Solve"]
edition = "2021"

[lib]
name = "alpha_solve_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
